name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skills, manifests and scripts
        run: python3 tools/validate.py
      - name: Build zips (smoke test)
        run: python3 tools/build_release.py
      - name: Installer lists and installs the own skills
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          python3 install.py list
          python3 install.py install --own -y
          test "$(ls "$HOME/.claude/skills" | wc -l)" -ge 8
          python3 install.py autopilot status
          python3 install.py autopilot off
